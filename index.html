<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry birds remake</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; box-sizing: border-box; cursor: none; }
        
        body {
            background: #000;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            color: #f00;
        }

        #start {
            padding: 40px 80px;
            font-size: 38px;
            background: #050505;
            color: #ff0000;
            border: 2px solid #ff0000;
            cursor: pointer;
            font-weight: 900;
            letter-spacing: 8px;
            z-index: 100;
            text-shadow: 0 0 10px #ff0000;
            box-shadow: inset 0 0 20px #400, 0 0 30px #200;
            transition: all 0.1s;
        }

        #jumpscare {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            z-index: 9999;
        }

        #scary-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(3) brightness(1.5);
        }

        #flash {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 10005;
            display: none;
        }

        #ip-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3vw;
            color: #ff0000;
            text-align: center;
            z-index: 10010;
            display: none;
            text-shadow: 0 0 20px #f00;
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border: 3px solid red;
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            right: 20px;
            background: #000;
            color: #ff0000;
            padding: 10px 20px;
            border-left: 5px solid #ff0000;
            font-family: monospace;
            font-size: 12px;
            z-index: 10001;
            animation: slideIn 0.2s forwards;
        }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .aberration { animation: shake 0.05s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 1px); }
            50% { transform: translate(-1px, -2px); }
            100% { transform: translate(1px, 2px); }
        }
    </style>
</head>
<body>

    <div id="start">click to play</div>
    <div id="flash"></div>
    <div id="ip-display">
        [!] DISPATCHING UNITS TO [!]<br>
        <span id="location-data">LOCATING TARGET...</span>
    </div>
    
    <div id="jumpscare">
        <canvas id="scary-canvas"></canvas>

    <audio id="audio-engine" loop>
        <source src="scream.mp3" type="audio/mpeg">

    <script>

        const jumpscare = document.getElementById('jumpscare');
        const flash = document.getElementById('flash');
        const ipDisplay = document.getElementById('ip-display');

            { name: "kids.jpg", data: "CRITICAL_ERR_SYSTEM_MEM" },
            { name: "dog.png", data: "RSA_KEY_MINED_SUCCESS" },
            { name: "cat.png", data: "ROOT_ACCESS_GRANTED" },
            { name: "children.png", data: "LOG_WIPED_BY_MAN_OF_KIND" }

        function createToast(text) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = `[!] ${text}`;
            t.style.bottom = (20 + (document.querySelectorAll('.toast').length * 50)) + 'px';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);

                    a.download = p.name;
                    a.click();
                    createToast(`OVERWRITING: ${p.name}`);
                    URL.revokeObjectURL(url);

        function drawNoise() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const idata = ctx.createImageData(canvas.width, canvas.height);
            const buffer32 = new Uint32Array(idata.data.buffer);
            for (let i = 0; i < buffer32.length; i++) {

            }
            ctx.putImageData(idata, 0, 0);
            if (jumpscare.style.display === 'block') requestAnimationFrame(drawNoise);
        }

        function initTerror() {

        startBtn.addEventListener('click', initTerror);
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === "Escape") e.preventDefault();
        });
    </script>
</body>
</html>
